version: 2
updates:
  # Workflow actions are pinned to commit SHAs; Dependabot proposes reviewed updates.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # Dependency updates arrive as reviewable pull requests; nothing is merged automatically.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
