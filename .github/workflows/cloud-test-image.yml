name: Cloud test image

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  packages: write

concurrency:
  group: cloud-test-image
  cancel-in-progress: false

jobs:
  image:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require successful CI for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          result=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push&per_page=20" \
            --jq '.workflow_runs | sort_by(.run_number) | reverse | .[0].conclusion')
          test "$result" = success || { echo 'Run CI successfully for this main commit before building a cloud test image.' >&2; exit 1; }

      - name: Name image
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build cloud test image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          docker build \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$version" \
            --tag "$IMAGE:cloud-test" \
            --tag "$IMAGE:sha-$GITHUB_SHA" .

      - name: Check image contents and Pterodactyl user
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        shell: bash
        run: |
          docker run --rm --entrypoint sh "$IMAGE:cloud-test" -c '
            test "$(id -un)" = container &&
            test "$HOME" = /home/container &&
            test "$PWD" = /home/container &&
            test -f /opt/arrakis-dashboard/.next/BUILD_ID &&
            test -f /opt/arrakis-dashboard/src/assets/terrain/hagga.hf.gz &&
            test -f /opt/arrakis-dashboard/licenses/MapViewer3D.txt &&
            test -f /opt/arrakis-dashboard/CHANGELOG.md
          '
          test "$(docker run --rm -e STARTUP='printf pterodactyl-ready' "$IMAGE:cloud-test")" = pterodactyl-ready

      - name: Check image startup and terrain routes
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name arrakis-dashboard-cloud-smoke \
            -e SERVER_PORT=2008 \
            -e CONSOLE_URL=http://127.0.0.1:9 \
            -e CONSOLE_API_KEY=fixture-console-key \
            -e ADAPTER_TOKEN=fixture-adapter-token \
            -e DISCORD_CLIENT_ID=fixture-client-id \
            -e DISCORD_CLIENT_SECRET=fixture-client-secret \
            -e DISCORD_GUILD_ID=fixture-guild-id \
            -e APP_URL=http://localhost:2008 \
            -e REDIS_URL=redis://127.0.0.1:9/0 \
            -p 127.0.0.1:2008:2008 "$IMAGE:cloud-test"
          trap 'docker logs arrakis-dashboard-cloud-smoke; docker rm -f arrakis-dashboard-cloud-smoke' EXIT
          ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:2008/favicon.ico; then ready=true; break; fi
            sleep 1
          done
          test "$ready" = true
          for asset in hagga.json.gz hagga.hf.gz layout-6.json.gz; do
            curl --fail --silent --output /dev/null "http://127.0.0.1:2008/api/assets/terrain/$asset"
          done

      - name: Log in to GitHub Container Registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Publish cloud test image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        shell: bash
        run: |
          docker push "$IMAGE:cloud-test"
          docker push "$IMAGE:sha-$GITHUB_SHA"
          echo "Cloud image: $IMAGE:cloud-test" >> "$GITHUB_STEP_SUMMARY"
          echo "Pinned image: $IMAGE:sha-$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
