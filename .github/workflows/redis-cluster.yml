name: Redis Cluster Integration

on:
  push:
    branches: [v2]
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: redis-cluster-${{ github.ref }}
  cancel-in-progress: false

jobs:
  integration:
    name: Redis Cluster Integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start a Redis Cluster
        shell: bash
        run: |
          set -euo pipefail
          for port in 7001 7002 7003 7004 7005 7006; do
            docker run -d --name "redis-$port" --network host redis:7.4-alpine \
              redis-server --port "$port" --cluster-enabled yes --cluster-config-file "nodes-$port.conf" \
              --cluster-node-timeout 3000 --appendonly no --save ""
          done
          sleep 3
          docker run --rm --network host redis:7.4-alpine redis-cli --cluster create \
            127.0.0.1:7001 127.0.0.1:7002 127.0.0.1:7003 127.0.0.1:7004 127.0.0.1:7005 127.0.0.1:7006 \
            --cluster-replicas 1 --cluster-yes
          for _ in $(seq 1 30); do
            docker run --rm --network host redis:7.4-alpine redis-cli -p 7001 cluster info | grep -q cluster_state:ok && exit 0
            sleep 1
          done
          echo "The Redis Cluster did not become healthy." >&2
          exit 1
      - name: Run full Redis Cluster integration suite
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results
          npm run test:integration 2>&1 | tee test-results/redis-cluster.log
        env:
          TEST_REDIS_CLUSTER_NODES: 127.0.0.1:7001,127.0.0.1:7002,127.0.0.1:7003
      - name: Record final cluster topology
        if: always()
        shell: bash
        run: |
          mkdir -p test-results
          docker exec redis-7001 redis-cli -p 7001 cluster info > test-results/redis-cluster-topology.log
          docker exec redis-7001 redis-cli -p 7001 cluster nodes >> test-results/redis-cluster-topology.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: redis-cluster-results
          path: |
            test-results/redis-cluster.log
            test-results/redis-cluster-topology.log
          if-no-files-found: warn
          retention-days: 7
      - name: Remove disposable cluster containers
        if: always()
        shell: bash
        run: |
          for port in 7001 7002 7003 7004 7005 7006; do
            docker rm -f "redis-$port" || true
          done
