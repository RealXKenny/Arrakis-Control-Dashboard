name: AI configuration
on:
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'GEMINI.md'
      - 'CODEX.md'
      - 'KIMI.md'
      - '.claude/**'
      - '.codex/**'
      - '.cursor/**'
      - '.continue/**'
      - '.clinerules/**'
      - '.roo/**'
      - '.windsurf/**'
      - '.github/copilot-instructions.md'
      - '.github/instructions/**'
      - '.github/workflows/ai-config.yml'
      - 'docs/ai/**'
      - 'scripts/maintenance/validate-ai-config.mjs'
  push:
    branches: [main]
    paths:
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'GEMINI.md'
      - 'CODEX.md'
      - 'KIMI.md'
      - '.claude/**'
      - '.codex/**'
      - '.cursor/**'
      - '.continue/**'
      - '.clinerules/**'
      - '.roo/**'
      - '.windsurf/**'
      - '.github/copilot-instructions.md'
      - '.github/instructions/**'
      - '.github/workflows/ai-config.yml'
      - 'docs/ai/**'
      - 'scripts/maintenance/validate-ai-config.mjs'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: node scripts/maintenance/validate-ai-config.mjs
