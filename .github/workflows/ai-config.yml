name: AI configuration
on:
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'GEMINI.md'
      - '.claude/**'
      - '.codex/**'
      - '.cursor/**'
      - '.github/copilot-instructions.md'
      - '.github/instructions/**'
      - '.github/workflows/ai-config.yml'
      - 'docs/ai/**'
      - 'scripts/maintenance/validate-ai-config.mjs'
  push:
    branches: [main]
    paths:
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'GEMINI.md'
      - '.claude/**'
      - '.codex/**'
      - '.cursor/**'
      - '.github/copilot-instructions.md'
      - '.github/instructions/**'
      - '.github/workflows/ai-config.yml'
      - 'docs/ai/**'
      - 'scripts/maintenance/validate-ai-config.mjs'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/maintenance/validate-ai-config.mjs
