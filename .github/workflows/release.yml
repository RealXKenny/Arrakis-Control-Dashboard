name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  validate:
    name: Release / Validate
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      create: ${{ steps.release.outputs.create }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Confirm the release commit is on main
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_EVENT: ${{ github.event.workflow_run.event }}
        run: |
          set -euo pipefail
          test "$HEAD_EVENT" = push || { echo "Releases run only after a push to main (got $HEAD_EVENT)." >&2; exit 1; }
          test "$HEAD_BRANCH" = main || { echo "Releases run only from main (got $HEAD_BRANCH)." >&2; exit 1; }
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$HEAD_SHA" refs/remotes/origin/main || {
            echo "Commit $HEAD_SHA is not on main; refusing to release." >&2
            exit 1
          }
          git checkout --detach "$HEAD_SHA"

      - name: Validate release version and notes
        id: release
        shell: bash
        run: |
          set -euo pipefail

          current_version=$(node -p "require('./package.json').version")
          lock_version=$(node -p "require('./package-lock.json').packages[''].version")
          if [ "$current_version" != "$lock_version" ]; then
            echo "package.json ($current_version) and package-lock.json ($lock_version) versions differ." >&2
            exit 1
          fi
          tag="v$current_version"

          if git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists; nothing to do."
            echo "create=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          previous_tag=$(git tag --merged HEAD --list 'v[0-9]*' --sort=-version:refname | head -n 1)
          previous_version=${previous_tag#v}

          VERSION="$current_version" PREVIOUS_VERSION="$previous_version" node <<'NODE'
          const stableSemver = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/;
          const current = stableSemver.exec(process.env.VERSION);

          if (!current) {
            throw new Error('Releases require stable semantic versions such as 1.2.3.');
          }

          if (!process.env.PREVIOUS_VERSION) process.exit(0);
          const previous = stableSemver.exec(process.env.PREVIOUS_VERSION);
          if (!previous) throw new Error(`Latest version tag is invalid: v${process.env.PREVIOUS_VERSION}`);

          const compare = [1, 2, 3]
            .map((index) => Number(current[index]) - Number(previous[index]))
            .find((difference) => difference !== 0) ?? 0;

          if (compare <= 0) {
            throw new Error(`Package version must increase (${process.env.PREVIOUS_VERSION} -> ${process.env.VERSION}).`);
          }
          NODE

          notes_file="$RUNNER_TEMP/release-notes.md"
          awk -v heading="## Patch Notes v$current_version" '
            { sub(/\r$/, "") }
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
            END { if (!found) exit 2 }
          ' CHANGELOG.md > "$notes_file" || {
            echo "CHANGELOG.md must contain a '## Patch Notes v$current_version' section." >&2
            exit 1
          }

          if ! grep -q '[^[:space:]]' "$notes_file"; then
            echo "The 'Patch Notes v$current_version' section in CHANGELOG.md is empty." >&2
            exit 1
          fi

          echo "create=true" >> "$GITHUB_OUTPUT"
          {
            echo "tag=$tag"
            echo "version=$current_version"
          } >> "$GITHUB_OUTPUT"

      - name: Build Pterodactyl egg
        if: steps.release.outputs.create == 'true'
        shell: bash
        env:
          EGG_FILE: ${{ runner.temp }}/egg-arrakis-control-dashboard.json
        run: |
          node scripts/deployment/build-pterodactyl-egg.mjs "$EGG_FILE"
          node -e "JSON.parse(require('node:fs').readFileSync(process.env.EGG_FILE, 'utf8'))"

      - name: Build checksummed source archive
        if: steps.release.outputs.create == 'true'
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          name="arrakis-control-dashboard-$RELEASE_VERSION.tar.gz"
          git archive --format=tar.gz --prefix=arrakis-control-dashboard/ --output="$RUNNER_TEMP/$name" "$RELEASE_SHA"
          (cd "$RUNNER_TEMP" && sha256sum "$name" > "$name.sha256" && sha256sum --check "$name.sha256")

      - name: Upload validated release assets
        if: steps.release.outputs.create == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: |
            ${{ runner.temp }}/egg-arrakis-control-dashboard.json
            ${{ runner.temp }}/arrakis-control-dashboard-${{ steps.release.outputs.version }}.tar.gz
            ${{ runner.temp }}/arrakis-control-dashboard-${{ steps.release.outputs.version }}.tar.gz.sha256
            ${{ runner.temp }}/release-notes.md
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Release / Publish
    needs: validate
    if: needs.validate.outputs.create == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets
          path: ${{ runner.temp }}/release-assets

      - name: Verify release assets
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          release_dir="$RUNNER_TEMP/release-assets"
          archive="arrakis-control-dashboard-$RELEASE_VERSION.tar.gz"
          (cd "$release_dir" && sha256sum --check "$archive.sha256")
          jq -e . "$release_dir/egg-arrakis-control-dashboard.json" >/dev/null
          test -s "$release_dir/release-notes.md"

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EGG_FILE: ${{ runner.temp }}/release-assets/egg-arrakis-control-dashboard.json
          ARCHIVE_FILE: ${{ runner.temp }}/release-assets/arrakis-control-dashboard-${{ needs.validate.outputs.version }}.tar.gz
          RELEASE_NOTES: ${{ runner.temp }}/release-assets/release-notes.md
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: >-
          gh release create "$RELEASE_TAG" "$EGG_FILE" "$ARCHIVE_FILE" "$ARCHIVE_FILE.sha256"
          --target "$RELEASE_SHA"
          --title "Arrakis Control Dashboard $RELEASE_VERSION"
          --notes-file "$RELEASE_NOTES"
