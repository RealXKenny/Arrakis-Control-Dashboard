name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Independent static checks share one runner; each keeps its own exit status.
      - name: Typecheck, lint, format and unit tests
        shell: bash
        run: |
          set -uo pipefail
          npm run typecheck > typecheck.log 2>&1 & typecheck=$!
          npm run lint > lint.log 2>&1 & lint=$!
          npm run format:check > format.log 2>&1 & format=$!
          npm test > unit.log 2>&1 & unit=$!
          status=0
          for check in typecheck lint format unit; do
            if wait "${!check}"; then echo "::group::$check passed"; else echo "::group::$check FAILED"; status=1; fi
            cat "$check.log"
            echo "::endgroup::"
          done
          exit "$status"

  integration:
    name: integration (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Software WebGL tests are CPU-bound; separate runners avoid contention instead of sharing one worker.
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-node22-next-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-node22-next-${{ hashFiles('package-lock.json') }}-
      - run: npm run build
      - if: matrix.shard == 1
        run: npm run test:production
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run test:browser -- --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-traces-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  verify:
    if: always()
    needs: [checks, integration]
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI job to pass
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
        run: test "$CHECKS_RESULT" = success && test "$INTEGRATION_RESULT" = success
