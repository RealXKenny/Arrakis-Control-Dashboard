name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-node22-next-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-node22-next-${{ hashFiles('package-lock.json') }}-
      - run: npm run build
      - run: npm run test:production
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-traces
          path: test-results/
          retention-days: 7

  verify:
    if: always()
    needs: [checks, integration]
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI job to pass
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
        run: test "$CHECKS_RESULT" = success && test "$INTEGRATION_RESULT" = success
